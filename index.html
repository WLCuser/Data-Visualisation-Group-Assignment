<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>National hospitalised injury counts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html"><img src="img/logo.svg"></a>
        <h1>National hospitalised injuries from road crash</h1>
        <h1 id="year_title" style="text-align: end; margin-right: 50px;">2011 - 2021</h1>
    </header>
    <nav>
        <a href="index.html" class="active">National hospitalised injury counts</a>
        <a href="page2.html">State and Territory hospitalised injury counts</a>
        <a href="page3.html">First Nations Peoples hospitalised injury counts</a>
    </nav>

    <div id="filters_year"><b>Calendar year: </b></div>
    <div id="filters_gender"><b>Gender: </b></div>
    <div id="filters_roaduser"><b>Road user: </b></div>
    <div id="filters_age"><b>Age group: </b></div>
    <div id="filters_remoteness"><b>Remoteness: </b></div>

    <div class="container">
        <div id="chart1"></div>
        <div id="chart2"></div>
        <div id="chart3"></div>
        <div id="chart4"></div>
    </div>

    <!-- D3.js Library -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <!-- Page 1 Modular Scripts -->
    <script src="js/page1/pg1-interaction.js"></script>
    <script src="js/page1/pg1-line-chart.js"></script>
    <script src="js/page1/pg1-horizontal-bar.js"></script>
    <script src="js/page1/pg1-vertical-bar.js"></script>
    <script src="js/page1/pg1-stacked-bar.js"></script>

    <!-- Main Initialization Script -->
    <script>
        let rawData = []; // Global master dataset

    document.addEventListener("DOMContentLoaded", function() {
        d3.csv("data/national_traffic_clean.csv").then(function(data) {
            data.forEach(d => {
                d['Calendar year'] = +d['Calendar year'];
                d['Hospitalisations'] = +d['Hospitalisations'];
            });

            rawData = data; // Save to global scope!

            setupFilters(rawData, function(filteredData) {
                // Pass BOTH filteredData and rawData so charts know what is selected vs full background
                drawChart1(filteredData, rawData);
                drawChart2(filteredData);
                drawChart3(filteredData);
                drawChart4(filteredData);
            });

            // Initial render with full data
            drawChart1(rawData, rawData);
            drawChart2(rawData);
            drawChart3(rawData);
            drawChart4(rawData);
        });
    });
    </script>
</body>
</html>
