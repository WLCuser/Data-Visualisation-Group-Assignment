<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <!-- Use isolated page1 CSS so it formats only your page without affecting teammates -->
    <link rel="stylesheet" href="css/page1.css">
</head>
<body id="page1-body">
    <!-- Header matching your groupmate's exact structure -->
    <!-- Header matching your teammate's exact layout -->
    <header>
        <a href="index.html"><img src="img/logo-white.png" alt="Logo"></a>
        <h1>National hospitalised injuries from road crash</h1>
        <h1 id="year_title">2011 - 2021</h1>
    </header>

    <nav>
        <a href="index.html" class="active">National hospitalised injury counts</a>
        <a href="page2.html">State and Territory hospitalised injury counts</a>
        <a href="page3.html">First Nations Peoples hospitalised injury counts</a>
    </nav>

    <div id="page1-container">
        <!-- Horizontal Filter Bar (All dropdowns side by side) -->
        <div class="filters-row">
            <div class="filter-group" id="filters_year"><b>Calendar year:</b></div>
            <div class="filter-group" id="filters_gender"><b>Gender:</b></div>
            <div class="filter-group" id="filters_roaduser"><b>Road user:</b></div>
            <div class="filter-group" id="filters_age"><b>Age group:</b></div>
            <div class="filter-group" id="filters_remoteness"><b>Remoteness:</b></div>
        </div>

        <!-- 4 Chart Cards Grid -->
        <div class="charts-grid">
            <div id="chart1" class="chart-card"></div>
            <div id="chart2" class="chart-card"></div>
            <div id="chart3" class="chart-card"></div>
            <div id="chart4" class="chart-card"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/page1/pg1-interaction.js"></script>
    <script src="js/page1/pg1-line-chart.js"></script>
    <script src="js/page1/pg1-horizontal-bar.js"></script>
    <script src="js/page1/pg1-vertical-bar.js"></script>
    <script src="js/page1/pg1-stacked-bar.js"></script>

    <script>
        let rawData = [];
        document.addEventListener("DOMContentLoaded", function() {
            d3.csv("data/national_traffic_clean.csv").then(function(data) {
                data.forEach(d => {
                    d['Calendar year'] = +d['Calendar year'];
                    d['Hospitalisations'] = +d['Hospitalisations'];
                });

                rawData = data;

                setupFilters(rawData, function(filteredData) {
                    drawChart1(filteredData, rawData);
                    drawChart2(filteredData);
                    drawChart3(filteredData);
                    drawChart4(filteredData);
                });

                drawChart1(rawData, rawData);
                drawChart2(rawData);
                drawChart3(rawData);
                drawChart4(rawData);
            });
        });
    </script>
</body>
</html>
